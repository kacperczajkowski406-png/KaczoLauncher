name: Build installer and mod
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['tools/**', 'kaczo-mod-26/**', '.github/workflows/explore.yml', '.github/workflows/mod26.yml']
jobs:
  mod:
    runs-on: ubuntu-latest
    continue-on-error: true   # wersja, która się nie skompiluje, nie blokuje reszty
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.21',   yarn: '1.21+build.9',   api: '0.101.2+1.21',   compat: old, loom: '1.9-SNAPSHOT' }
          - { mc: '1.21.1', yarn: '1.21.1+build.3', api: '0.116.17+1.21.1', compat: old, loom: '1.9-SNAPSHOT' }
          - { mc: '1.21.2', yarn: '1.21.2+build.1', api: '0.106.1+1.21.2', compat: new, loom: '1.9-SNAPSHOT' }
          - { mc: '1.21.3', yarn: '1.21.3+build.2', api: '0.114.1+1.21.3', compat: new, loom: '1.9-SNAPSHOT' }
          - { mc: '1.21.4', yarn: '1.21.4+build.8', api: '0.119.4+1.21.4', compat: new, loom: '1.9-SNAPSHOT' }
          - { mc: '1.21.5', yarn: '1.21.5+build.1', api: '0.128.2+1.21.5', compat: new5, loom: '1.10-SNAPSHOT' }
          - { mc: '1.21.6', yarn: '1.21.6+build.1', api: '0.128.2+1.21.6', compat: v6, loom: '1.10-SNAPSHOT' }
          - { mc: '1.21.7', yarn: '1.21.7+build.8', api: '0.129.0+1.21.7', compat: v6, loom: '1.10-SNAPSHOT' }
          - { mc: '1.21.8', yarn: '1.21.8+build.1', api: '0.136.1+1.21.8', compat: v6, loom: '1.10-SNAPSHOT' }
          - { mc: '1.21.9',  yarn: '1.21.9+build.1',  api: '0.134.1+1.21.9',  compat: v9, loom: '1.11.8', gradle: '8.14.3' }
          - { mc: '1.21.10', yarn: '1.21.10+build.3', api: '0.138.4+1.21.10', compat: v9, loom: '1.11.8', gradle: '8.14.3' }
          - { mc: '1.21.11', yarn: '1.21.11+build.6', api: '0.141.6+1.21.11', compat: v9, loom: '1.13.6', gradle: '9.2.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle || '8.12' }}
      - id: build
        run: set -o pipefail; gradle build --no-daemon -Pminecraft_version=${{ matrix.mc }} -Pyarn_mappings=${{ matrix.yarn }} -Pfabric_version=${{ matrix.api }} -Pcompat=${{ matrix.compat }} -Ploom_version=${{ matrix.loom }} 2>&1 | tee build.log
        working-directory: kaczo-mod-src
      - name: Pokaż błędy kompilacji
        if: failure()
        working-directory: kaczo-mod-src
        run: |
          grep -E -A2 "error:|What went wrong|Could not" build.log | grep -v "^--" | head -60 | while IFS= read -r l; do echo "::error::${l:0:480}"; done
      - run: |
          mkdir -p out
          cp kaczo-mod-src/build/libs/kaczo-hud-*[0-9].jar out/kaczo-hud-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with: { name: 'kaczo-hud-${{ matrix.mc }}', path: out/*.jar }
  win:
    runs-on: windows-latest
    needs: mod
    permissions:
      contents: write   # potrzebne do utworzenia wydania (Release) z instalatorem – z niego pobierają się aktualizacje w aplikacji
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'kaczo-hud-*', path: kaczo-mod, merge-multiple: true }
      - name: Sprawdź, czy mody się zbudowały
        shell: bash
        run: |
          n=$(ls kaczo-mod/*.jar 2>/dev/null | wc -l); echo "zbudowane wersje moda: $n"
          if [ "$n" -lt 8 ]; then echo "::error::Zbudowało się tylko $n wersji moda – instalator nie zostanie wydany"; exit 1; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # każda budowa dostaje nowszy numer wersji, dzięki czemu zainstalowana aplikacja widzi aktualizację
      - run: npm version 1.2.${{ github.run_number }} --no-git-tag-version
        shell: bash
      # adres wydań dla automatycznych aktualizacji bierzemy z nazwy repozytorium (działa też po jego zmianie)
      - run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));const [o,r]=process.env.GITHUB_REPOSITORY.split('/');p.build.publish=[{provider:'github',owner:o,repo:r}];fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: Kaczo-Client-Setup, path: dist/*Setup*.exe }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Kaczo Client 1.2.${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/*Setup*.exe
            dist/*.blockmap
            dist/latest.yml
