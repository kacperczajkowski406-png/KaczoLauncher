name: Visual test 26.x
on:
  workflow_dispatch:
    inputs:
      mc:    { description: 'Minecraft', default: '26.1.2' }
      world: { description: 'tryb (1 swiat, 0 menu, 5 lyrics, 6 drawer)', default: '1' }
      shots: { description: 'sekundy zrzutow', default: '60,90,120' }
jobs:
  visual26:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_USER_HOME: /tmp/gh-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-disabled: true
      - name: Mapowania yarn -> Mojang
        working-directory: tools/explore
        run: python3 mappings.py
      - name: Generuj, kompiluj i poprawiaj
        env:
          MC: '26.1'
          FAPI: '0.145.1+26.1'
          LOOM: '1.17-SNAPSHOT'
        run: bash tools/port26/run.sh
      - name: Dump class members
        run: |
          J=$(find /tmp/gh-home -name "minecraft-merged-deobf-26.1.jar" | head -1)
          for n in LoadingOverlay BossHealthOverlay PanoramaRenderer SplashRenderer LogoRenderer ClientLevel GameRenderer Camera Gui; do
            c=$(unzip -Z1 "$J" | grep -E "(^|/)$n\.class$" | grep -E "net/minecraft/client" | head -1 | sed 's/\.class$//; s#/#.#g')
            echo "=== $c"; javap -p -cp "$J" "$c" 2>/dev/null | grep -E "render|Render|extract|rogress|fade|Fade|SkyColor|bob|Bob|hurt|Hurt|setRotation|update\(|draw|Logo|Crosshair|crosshair|Scoreboard|scoreboard" | cut -c1-200
          done
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libgl1-mesa-dri libglx-mesa0 libglu1-mesa libopenal1 x11-utils xdotool >/dev/null
          cd tools/visual && npm init -y >/dev/null && npm i minecraft-launcher-core --no-audit --no-fund >/dev/null
      - name: Run Minecraft
        working-directory: tools/visual
        env:
          MC: ${{ inputs.mc }}
          STYLE: '8'
          WORLD: ${{ inputs.world }}
          SHOTS: ${{ inputs.shots }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
        run: |
          export JAR=$(ls ../../kaczo-mod-26/build/libs/kaczo-hud-*[0-9].jar | head -1)
          xvfb-run -a -s "-screen 0 1280x720x24" node run.js 2>&1 | tail -80
      - name: Publish screenshots
        run: |
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan visual-data
          git rm -rf . >/dev/null 2>&1 || true
          cp -r tools/visual/shots/* . 2>/dev/null || true
          git add -A . ':!tools' ':!kaczo-mod-src' >/dev/null 2>&1 || git add -A
          git commit -qm "visual ${{ inputs.mc }} style ${{ inputs.style }}" || true
          git push -f origin visual-data
