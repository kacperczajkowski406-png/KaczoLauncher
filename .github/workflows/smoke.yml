name: Smoke launcher
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Start Electron under xvfb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgbm1 libasound2t64 >/dev/null || true
          (timeout 25 xvfb-run -a npx electron . --no-sandbox --enable-logging=stderr > smoke.log 2>&1; echo "exit=$?" >> smoke.log) || true
          M=$(grep -vE "bus.cc|viz_main|shared_image|one_copy|gpu_memory|sandbox_linux|dri3|dbus|GPU" smoke.log | head -c 6000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=smoke-log::$M"
          exit 1
