name: Visual test
on:
  workflow_dispatch:
    inputs:
      mc:     { description: 'Minecraft',  default: '1.21.4' }
      yarn:   { description: 'yarn',       default: '1.21.4+build.8' }
      api:    { description: 'fabric api', default: '0.119.4+1.21.4' }
      compat: { description: 'compat',     default: 'new' }
      loom:   { description: 'loom',       default: '1.9-SNAPSHOT' }
      gradle: { description: 'gradle',     default: '8.12' }
      style:  { description: 'styl nieba', default: '8' }
      world:  { description: 'wejdź do świata (1/0)', default: '1' }
      shaders: { description: 'shadery Iris (1/0)', default: '0' }
      shdstyle: { description: 'styl shaderow 0/1/2', default: '0' }
      press:  { description: 'sekunda:klawisz (np. 40:Shift_R)', default: '' }
      shots:  { description: 'sekundy zrzutów', default: '45,80,120,160' }
jobs:
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '${{ inputs.gradle }}' }
      - name: Build mod
        working-directory: kaczo-mod-src
        run: gradle build --no-daemon -Pminecraft_version=${{ inputs.mc }} -Pyarn_mappings=${{ inputs.yarn }} -Pfabric_version=${{ inputs.api }} -Pcompat=${{ inputs.compat }} -Ploom_version=${{ inputs.loom }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libgl1-mesa-dri libglx-mesa0 libglu1-mesa libopenal1 x11-utils xdotool >/dev/null
          cd tools/visual && npm init -y >/dev/null && npm i minecraft-launcher-core --no-audit --no-fund >/dev/null
      - name: Run Minecraft
        working-directory: tools/visual
        env:
          MC: ${{ inputs.mc }}
          STYLE: ${{ inputs.style }}
          WORLD: ${{ inputs.world }}
          PRESS: ${{ inputs.press }}
          SHADERS: ${{ inputs.shaders }}
          SHDSTYLE: ${{ inputs.shdstyle }}
          SHOTS: ${{ inputs.shots }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
        run: |
          export JAR=$(ls ../../kaczo-mod-src/build/libs/kaczo-hud-*[0-9].jar | head -1)
          xvfb-run -a -s "-screen 0 1280x720x24" node run.js 2>&1 | tail -80
      - name: Publish screenshots
        run: |
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan visual-data
          git rm -rf . >/dev/null 2>&1 || true
          cp -r tools/visual/shots/* . 2>/dev/null || true
          git add -A . ':!tools' ':!kaczo-mod-src' >/dev/null 2>&1 || git add -A
          git commit -qm "visual ${{ inputs.mc }} style ${{ inputs.style }}" || true
          git push -f origin visual-data
