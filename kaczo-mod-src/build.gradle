plugins {
    id 'fabric-loom'
}

version = project.mod_version
group = 'pl.kaczo'
base { archivesName = 'kaczo-hud' }

repositories { }

// wariant API rysowania wybierany przez -Pcompat=old (1.21-1.21.1) | new (1.21.2-1.21.5) | v6 (1.21.6-1.21.8)
sourceSets.main.java.srcDir('src/compat_' + (project.findProperty('compat') ?: 'new') + '/java')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'mc': project.minecraft_version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
